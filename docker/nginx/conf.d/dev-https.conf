# HTTPS local (mkcert)
server {
  listen 443 ssl http2;
  server_name int.getinvoice.com;

  ssl_certificate     /etc/nginx/certs/int.getinvoice.com+1.pem;
  ssl_certificate_key /etc/nginx/certs/int.getinvoice.com+1-key.pem;

  # Laravel backend
  location ^~ /api/ {
    include        /etc/nginx/fastcgi_params;
    fastcgi_pass   backend:9000;
    fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
    fastcgi_param  PATH_INFO        $uri;
    fastcgi_param  REQUEST_URI      $request_uri;
    fastcgi_param  QUERY_STRING     $query_string;
    fastcgi_param  DOCUMENT_ROOT    /var/www/html/public;
    fastcgi_param  SCRIPT_NAME      /index.php;
    fastcgi_index  index.php;
  }

  # Laravel backend - Invoice preview
  location ^~ /preview/invoice/ {
    include        /etc/nginx/fastcgi_params;
    fastcgi_pass   backend:9000;
    fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
    fastcgi_param  PATH_INFO        $uri;
    fastcgi_param  REQUEST_URI      $request_uri;
    fastcgi_param  QUERY_STRING     $query_string;
    fastcgi_param  DOCUMENT_ROOT    /var/www/html/public;
    fastcgi_param  SCRIPT_NAME      /index.php;
    fastcgi_index  index.php;
  }

  # Laravel dev PDF routes
  location ^~ /dev/ {
    include        /etc/nginx/fastcgi_params;
    fastcgi_pass   backend:9000;
    fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
    fastcgi_param  PATH_INFO        $uri;
    fastcgi_param  REQUEST_URI      $request_uri;
    fastcgi_param  QUERY_STRING     $query_string;
  }

  location /storage/ {
    alias /var/www/html/storage/app/public/;
    access_log off;
    expires 1y;
  }

  location /profile_images/ {
  alias /var/www/html/storage/app/public/profile_images/;
  access_log off;
  expires 1y;
}

  # Next.js frontend
  location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;   # http if you’re on plain HTTP
      proxy_read_timeout 120s;

      proxy_pass http://frontend:3000;
  }
}

# Optional: redirect plain HTTP → HTTPS
server {
  listen 80;
  server_name int.getinvoice.com;
  return 301 https://$host$request_uri;
}
