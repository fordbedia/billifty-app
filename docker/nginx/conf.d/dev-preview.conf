# Dedicated dev preview server (HTTP)
server {
  listen 8081;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=30s;
  set $backend_upstream backend:9000;

  # ✅ set this to the real Laravel public/ path inside the nginx container
  root /var/www/html/public;
  index index.php index.html;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;

    # ✅ with "root", use document_root + fastcgi_script_name
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    fastcgi_pass $backend_upstream;   # PHP-FPM in backend container
    fastcgi_param HTTP_HOST $host;
  }
}
