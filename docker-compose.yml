services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      # Enable 443 after you add SSL + prod-https.conf:
#      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend:/var/www/html
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks: [ webnet ]

  backend:
    build:
      context: .
      dockerfile: ./docker/php/app.dockerfile
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://billifty.com
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://billifty.com,http://www.billifty.com
    volumes:
      - ./backend:/var/www/html
      - ./shared-resources:/var/www/shared-resources
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - postgres
    networks: [ webnet ]

  composer:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: ["composer", "install", "--no-dev", "--prefer-dist", "--no-progress", "--no-interaction"]
    networks: [ webnet ]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/app.dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    volumes:
      - ./frontend:/usr/src/app
    # IMPORTANT: bind to 0.0.0.0 so nginx can reach it
    command: ["npm","run","start"]
    expose:
      - "3000"
    networks: [ webnet ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [ webnet ]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # optional: persist Redis data
    volumes:
      - redis-data:/data
    networks: [ webnet ]

  certbot:
    image: certbot/certbot:latest
    depends_on:
      - nginx
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "
        trap 'exit 0' TERM INT;
        while :; do
          certbot renew --webroot -w /var/www/certbot --agree-tos --non-interactive || true;
          sleep 12h;
        done
      "
    networks: [ webnet ]

networks:
  webnet:

volumes:
  pgdata:
  storage:
  certbot-www:
  certbot-certs:
  redis-data:
