services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # Enable 443 after you add SSL + prod-https.conf:
#      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend:/var/www/html
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks: [ webnet ]

  backend:
    build:
      context: .
      dockerfile: ./docker/php/app.dockerfile
    env_file:
      - ./configs/.env.prod
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: billifty_u
      DB_PASSWORD: b1ll1iftykamikalara0213
      PLAYWRIGHT_PDF_SERVICE_URL: ${PLAYWRIGHT_PDF_SERVICE_URL:-http://playwright:3000}
    volumes:
      - ./backend:/var/www/html
      - ./shared-resources:/var/www/shared-resources
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - mysql
      - playwright
    networks: [ webnet ]

  composer:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: ["composer", "install", "--no-dev", "--prefer-dist", "--no-progress", "--no-interaction"]
    networks: [ webnet ]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/app.dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    # IMPORTANT: bind to 0.0.0.0 so nginx can reach it
    command: ["npm","run","start"]
    expose:
      - "3000"
    networks: [ webnet ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 90s

#  postgres:
#    image: postgres:15
#    environment:
#      POSTGRES_DB: ${DB_DATABASE}
#      POSTGRES_USER: ${DB_USERNAME}
#      POSTGRES_PASSWORD: ${DB_PASSWORD}
#    volumes:
#      - pgdata:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"
#    networks: [ webnet ]

  mysql:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: billifty_u
      MYSQL_PASSWORD: b1ll1iftykamikalara0213
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks: [ webnet ]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # optional: persist Redis data
    volumes:
      - redis-data:/data
    networks: [ webnet ]

  certbot:
    image: certbot/certbot:latest
    depends_on:
      - nginx
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "
        trap 'exit 0' TERM INT;
        while :; do
          certbot renew --webroot -w /var/www/certbot --agree-tos --non-interactive || true;
          sleep 12h;
        done
      "
    networks: [ webnet ]

  scheduler:
    build:
      context: .
      dockerfile: ./docker/php/app.dockerfile
    env_file:
      - ./configs/.env.prod
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: billifty_u
      DB_PASSWORD: b1ll1iftykamikalara0213
      PLAYWRIGHT_PDF_SERVICE_URL: ${PLAYWRIGHT_PDF_SERVICE_URL:-http://playwright:3000}
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./shared-resources:/var/www/shared-resources
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
      - playwright
    networks: [ webnet ]
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: ./docker/php/app.dockerfile
    env_file:
      - ./configs/.env.prod
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: billifty_u
      DB_PASSWORD: b1ll1iftykamikalara0213
      PLAYWRIGHT_PDF_SERVICE_URL: ${PLAYWRIGHT_PDF_SERVICE_URL:-http://playwright:3000}
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./shared-resources:/var/www/shared-resources
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
      - playwright
    networks: [ webnet ]
    command: sh -c "php artisan queue:work --sleep=1 --tries=5 --timeout=120 --backoff=5 --queue=default"
    restart: unless-stopped

  playwright:
    build:
      context: .
      dockerfile: ./docker/playwright/Dockerfile
    expose:
      - "3000"
    networks: [ webnet ]
    restart: unless-stopped


networks:
  webnet:

volumes:
#  pgdata:
  storage:
  certbot-www:
  certbot-certs:
  redis-data:
  mysqldata:
  frontend-node-modules:
  frontend-next:
