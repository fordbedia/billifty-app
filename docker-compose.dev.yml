services:
  nginx:
    ports:
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${NGINX_PREVIEW_PORT:-8086}:8081"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certs:/etc/nginx/certs:ro
    environment:
      NGINX_ENV: dev

  backend:
    env_file:
      - ./configs/.env.local
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: billifty_u
      DB_PASSWORD: b1ll1iftykamikalara0213
    command: bash -c "php -v && php-fpm"

  queue-worker:
    env_file:
      - ./configs/.env.local
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: billifty_u
      DB_PASSWORD: b1ll1iftykamikalara0213
    command: sh -c "php artisan queue:work --sleep=1 --tries=5 --timeout=120 --backoff=5 --queue=default"
    volumes:
      - ./backend:/var/www/html
      - ./shared-resources:/var/www/shared-resources
      - ./backend/storage:/var/www/html/storage

  scheduler:
    env_file:
      - ./configs/.env.local
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: billifty_u
      DB_PASSWORD: b1ll1iftykamikalara0213
    volumes:
      - ./backend:/var/www/html
      - ./shared-resources:/var/www/shared-resources
      - ./backend/storage:/var/www/html/storage

  frontend:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api
      # help watch changes over bind mounts
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLL_INTERVAL: "300"
      CHOKIDAR_USEPOLLING: "true"   # harmless with Turbopack; helps some setups
    command: ["sh", "-c", "npm install && mkdir -p .next/static/development && npm run dev"]
    volumes:
      - ./frontend:/usr/src/app:delegated
      - frontend-node-modules:/usr/src/app/node_modules
      - frontend-next:/usr/src/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 120s

#  postgres:
#    ports:
#      - "5433:5432"
  mysql:
    image: mysql:latest
    container_name: billifty_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: billifty_u
      MYSQL_PASSWORD: b1ll1iftykamikalara0213
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  # host:container (change host port if you want)

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
