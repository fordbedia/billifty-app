services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certs:/etc/nginx/certs:ro
    environment:
      NGINX_ENV: dev

  backend:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: billifty_u
      DB_PASSWORD: b1ll1iftykamikalara0213
    command: bash -c "php -v && php-fpm"
    volumes:
      - ./configs/.env.local:/var/www/html/.env:ro

  frontend:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api
      # help watch changes over bind mounts
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLL_INTERVAL: "300"
      CHOKIDAR_USEPOLLING: "true"   # harmless with Turbopack; helps some setups
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./frontend:/usr/src/app:delegated  # delegated improves perf o

#  postgres:
#    ports:
#      - "5433:5432"
  mysql:
    image: mysql:latest
    container_name: billifty_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: billifty_u
      MYSQL_PASSWORD: b1ll1iftykamikalara0213
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  # host:container (change host port if you want)

  redis:
    ports:
      - "6379:6379"
